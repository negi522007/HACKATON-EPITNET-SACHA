<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family={{ heading_font_url }}&family={{ body_font_url }}&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: {{ tokens.color_palette.primary }};
    --color-secondary: {{ tokens.color_palette.secondary }};
    --color-accent: {{ tokens.color_palette.accent }};
    --color-background: {{ tokens.color_palette.background }};
    --color-text: {{ tokens.color_palette.text }};
    --font-heading: '{{ tokens.typography.heading_font }}', serif;
    --font-body: '{{ tokens.typography.body_font }}', sans-serif;
    --section-padding: {{ spacing_value }};
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    color: var(--color-text);
    background: var(--color-background);
    line-height: 1.6;
  }
  h1, h2, h3 { font-family: var(--font-heading); line-height: 1.2; }
  section { padding: var(--section-padding) 1.5rem; max-width: 1100px; margin: 0 auto; }
  .btn {
    display: inline-block;
    padding: 0.85rem 1.75rem;
    background: var(--color-primary);
    color: var(--color-background);
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
  }
  .hero { text-align: center; }
  .hero--split { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 2rem; text-align: left; }
  .hero--fullscreen { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: var(--color-primary); color: var(--color-background); }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 1rem; }
  .hero p { font-size: 1.15rem; margin-bottom: 1.5rem; opacity: 0.85; }
  .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
  .services-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
  .service-card { padding: 1.5rem; border: 1px solid var(--color-secondary); border-radius: 8px; }
  .about { background: var(--color-secondary); }
  .contact { text-align: center; }
  .contact dl { display: inline-block; text-align: left; margin-top: 1rem; }
  .contact dt { font-weight: 600; color: var(--color-primary); }
  .contact dd { margin-bottom: 0.75rem; }
  footer { text-align: center; padding: 2rem 1.5rem; font-size: 0.9rem; opacity: 0.7; }
</style>
</head>
<body>
{{ body|safe }}
</body>
</html>
